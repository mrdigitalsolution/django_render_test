<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Django</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }
        .container {
            max-width: 760px;
            margin: 60px auto;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        .badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #e8f1ff;
            color: #1857a6;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 7px 0 14px;
            border: 1px solid #d7dce5;
            border-radius: 9px;
            font-size: 15px;
        }
        textarea { min-height: 100px; resize: vertical; }
        button {
            border: 0;
            padding: 12px 20px;
            border-radius: 9px;
            background: #1857a6;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
        .success {
            padding: 10px;
            margin-bottom: 18px;
            background: #e8f8ee;
            border-radius: 8px;
        }
        code {
            background: #f0f2f5;
            padding: 3px 6px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <span class="badge">Django + HTML/CSS</span>
        <h1>Welcome to Django 🚀</h1>
        <p>This is a small Render deployment testing project.</p>
        <p>Backend: <code>Django</code> | Database: <code>SQLite</code></p>

        {% for message in messages %}
            <div class="success">{{ message }}</div>
        {% endfor %}

        <h2>Test Lead Form</h2>
        <form method="post" action="{% url 'lead' %}">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="email" placeholder="Your email" required>
            <textarea name="message" placeholder="Message"></textarea>
            <button type="submit">Submit Lead</button>
        </form>

        <p style="margin-top:25px;">
            Admin panel: <code>/admin/</code>
        </p>
    </div>
</div>
</body>
</html>
